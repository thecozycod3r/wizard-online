<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#140d09">
<title>Splendor · Table Night</title>
<meta name="description" content="Collect ores, build mines and guilds, win the favour of nobles. Splendor rules for 2–6 players. Start a table, share the link, play.">
<meta property="og:title" content="Splendor — join my game">
<meta property="og:description" content="Tap the link, enter your name, and play Splendor with friends.">
<meta property="og:image" content="art/nob01@2x.webp">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Splendor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&family=Alegreya+Sans:wght@500;700;800&display=swap">
<style>
/* Layout: a merchant's table by candlelight — nobles, three market rows, the ore bank, then your own ledger. */
:root{
  --bg:#140d09; --bg2:#21160f; --panel:#2a1c13; --line:#4a3424; --ink:#f4e9d8; --dim:#b9a58d; --brass:#d9a74a; --brass-2:#f3d48a; --bad:#ff8a73; --good:#8fe0a8;
  --silver:#e8edf4; --cobalt:#3d73e6; --malachite:#25a467; --cinnabar:#d8382d; --iron:#3b3c46; --gold:#e9b52e;
  --display:"IM Fell English SC",Georgia,serif; --body:"Alegreya",Georgia,serif; --num:"Alegreya Sans",system-ui,sans-serif;
  --cw:64px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
img{-webkit-touch-callout:none;-webkit-user-drag:none}
button,a{touch-action:manipulation}
html,body{height:100%}
body{margin:0;height:100dvh;overflow:hidden;background:radial-gradient(900px 600px at 50% 20%,#3a2414 0%,var(--bg) 70%) fixed,var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding:env(safe-area-inset-top,0) max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(10px,env(safe-area-inset-left,0px));overscroll-behavior:none}
#app{height:100%}
[hidden]{display:none!important}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--num);font-weight:800;letter-spacing:.03em;
  font-size:14px;padding:10px 16px;border-radius:10px;background:linear-gradient(180deg,var(--brass-2),var(--brass));color:#2a1a05;box-shadow:0 3px 0 #7c5a1d,0 6px 16px rgba(0,0,0,.35);user-select:none;min-height:40px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7c5a1d}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:6px 11px;font-size:13px;min-height:36px}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn:focus-visible,.tok:focus-visible,.dcard:focus-visible{outline:2px solid var(--brass-2);outline-offset:3px}
input[type=text]{font:inherit;font-size:18px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%}
input[type=text]:focus{outline:2px solid var(--brass);border-color:transparent}
.muted{color:var(--dim)} .err{color:var(--bad);min-height:1.3em;font-size:15px}
.eyebrow{font-family:var(--num);font-weight:800;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}
.title{font-family:var(--display);font-size:clamp(44px,12vw,72px);line-height:.95;margin:0;text-shadow:0 0 30px rgba(217,167,74,.35)}

/* ---------- landing / lobby ---------- */
.page{height:100%;overflow-y:auto;max-width:560px;margin:0 auto;padding-block:24px 40px;display:flex;flex-direction:column;gap:16px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fan{display:flex;justify-content:center;height:140px;margin-bottom:4px}
.fan img{width:100px;height:100px;border-radius:12px;object-fit:cover;box-shadow:0 10px 24px rgba(0,0,0,.6);margin:0 -16px;border:2px solid #5a3e26}
.panel{background:rgba(42,28,19,.82);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>input{flex:1 1 200px;min-width:0}
.share{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.share code{flex:1 1 220px;min-width:0;font-size:14px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg2);border-radius:10px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:13px;color:#1a120a;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}.dot.off{background:#666}
.badge{font-family:var(--num);font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:var(--brass);color:#2a1a05}
.badge.off{background:#555;color:#ddd}
.setup{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.setup dt{color:var(--dim)} .setup dd{margin:0;font-family:var(--num);font-weight:700}

/* ---------- table ---------- */
#table{height:100%;display:flex;flex-direction:column;max-width:1200px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;padding-block:8px 4px;flex:none}
.bar .info{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.rnd{font-family:var(--num);font-weight:800;font-size:17px;line-height:1;display:flex;flex-direction:column}
.rnd small{font-size:10.5px;letter-spacing:.2em;color:var(--brass)}
.finalb{font-family:var(--num);font-weight:800;font-size:11px;letter-spacing:.1em;padding:4px 8px;border-radius:999px;background:var(--cinnabar);color:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:0}
.layout{display:flex;flex-direction:column;gap:10px}
.opps{display:flex;gap:7px;overflow-x:auto;padding-top:14px;padding-bottom:2px;scrollbar-width:none;flex:none}
.opp{position:relative;flex:1 0 118px;max-width:200px;background:rgba(42,28,19,.9);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.opp.turn{border-color:var(--brass-2);box-shadow:0 0 0 1px var(--brass-2),0 0 16px rgba(243,212,138,.35)}
.opp.me{background:rgba(217,167,74,.1)}
.opp .nm{display:flex;align-items:center;gap:5px;font-family:var(--num);font-weight:800;font-size:13px;min-width:0}
.opp .nm .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.opp .av{width:20px;height:20px;font-size:10px}
.opp .pts{font-family:var(--num);font-weight:800;font-size:20px;line-height:1}
.opp .pts small{font-size:11px;color:var(--dim);font-weight:700}
.mini{display:flex;gap:3px;align-items:center}
.mini i{width:15px;height:17px;border-radius:3px;font-style:normal;font-family:var(--num);font-weight:800;font-size:11px;display:grid;place-items:center;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5)}
.mini i.z{opacity:.28}
.opp .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-family:var(--num);font-weight:700}
.crown{position:absolute;left:50%;top:-14px;width:28px;height:20px;transform:translateX(-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)) drop-shadow(0 0 8px rgba(255,210,90,.55))}
.crown.pop{animation:crownpop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes crownpop{0%{transform:translateX(-50%) translateY(-24px) scale(.2) rotate(-25deg);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}

.sec{display:flex;flex-direction:column;gap:6px}
.sec h3{margin:0;font-family:var(--num);font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.nobles{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.noble{position:relative;flex:none;width:76px;height:76px;border-radius:10px;overflow:hidden;border:2px solid #7b5a33;background:#000;cursor:pointer}
.noble img{width:100%;height:100%;object-fit:cover}
.noble .np{position:absolute;top:2px;left:4px;font-family:var(--num);font-weight:800;font-size:18px;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
.noble .req{position:absolute;left:3px;bottom:3px;display:flex;flex-direction:column;gap:2px}
.noble .req i{width:16px;height:16px;border-radius:3px;font-style:normal;font-family:var(--num);font-weight:800;font-size:11px;display:grid;place-items:center;color:#fff;border:1px solid rgba(0,0,0,.4);text-shadow:0 1px 1px rgba(0,0,0,.6)}
.noble.can{border-color:var(--good);box-shadow:0 0 12px rgba(143,224,168,.5)}

.mrow{display:flex;gap:6px;align-items:stretch;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.deck{position:relative;flex:none;width:var(--cw);aspect-ratio:63/88;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid #5a3e26;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.deck img{width:100%;height:100%;object-fit:cover}
.deck b{position:absolute;inset:auto 0 4px;text-align:center;font-family:var(--num);font-weight:800;font-size:13px;text-shadow:0 1px 3px #000}
.deck.empty{opacity:.25;pointer-events:none}
.dcard{position:relative;flex:none;width:var(--cw);aspect-ratio:63/88;border-radius:8px;overflow:hidden;background:#2b1d12;border:1px solid #6b4b2e;box-shadow:0 4px 10px rgba(0,0,0,.5);cursor:pointer;touch-action:pan-x;transition:transform .15s}
.dcard .art{position:absolute;inset:0 0 auto 0;height:70%;background-size:cover;background-position:center}
.dcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 48%,rgba(20,12,7,.96) 72%)}
.dcard .top{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;padding:3px 4px;z-index:1}
.dcard .pt{font-family:var(--num);font-weight:800;font-size:calc(var(--cw) * .32);line-height:1;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
.dcard .bonus{width:calc(var(--cw) * .3);height:calc(var(--cw) * .3);border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 4px #000}
.dcard .cost{position:absolute;left:3px;bottom:3px;display:flex;flex-direction:column-reverse;gap:2px;z-index:1}
.dcard .cost i{width:max(15px,calc(var(--cw) * .25));height:max(15px,calc(var(--cw) * .25));border-radius:50%;font-style:normal;font-family:var(--num);font-weight:800;font-size:max(10.5px,calc(var(--cw) * .17));display:grid;place-items:center;color:#fff;border:1px solid rgba(0,0,0,.5);text-shadow:0 1px 1px rgba(0,0,0,.7)}
.dcard .lv{position:absolute;right:4px;bottom:4px;z-index:1;display:flex;gap:2px}
.dcard .lv span{width:4px;height:4px;border-radius:50%;background:var(--brass-2)}
.dcard.can{border-color:var(--good);box-shadow:0 0 0 2px rgba(143,224,168,.8),0 4px 10px rgba(0,0,0,.5)}
.dcard.can::before{content:"✓";position:absolute;right:3px;bottom:12px;z-index:2;font-family:var(--num);font-weight:800;font-size:12px;color:var(--good);text-shadow:0 1px 2px #000}
.dcard.hiddenres .art{filter:none}
.dcard.drop{animation:cardin .35s ease-out}
@keyframes cardin{from{transform:translateY(-10px) scale(1.06);opacity:0}to{transform:none;opacity:1}}
.slot{flex:none;width:var(--cw);aspect-ratio:63/88;border-radius:8px;border:1px dashed var(--line)}

.bank{display:flex;gap:8px;justify-content:space-between;flex-wrap:nowrap}
.tok{all:unset;position:relative;flex:1 1 0;max-width:62px;aspect-ratio:1;border-radius:50%;cursor:pointer;transition:transform .12s;box-shadow:0 4px 10px rgba(0,0,0,.55)}
.tok img{width:100%;height:100%;border-radius:50%;object-fit:cover;transform:scale(1.22)}
.tok{overflow:visible}
.tok .clip{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.tok .n{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:22px;border-radius:11px;background:#120b07;border:1px solid var(--line);font-family:var(--num);font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 5px}
.tok .pick{position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:var(--brass-2);color:#2a1a05;font-family:var(--num);font-weight:800;font-size:12px;border-radius:9px;padding:1px 7px;box-shadow:0 2px 4px #000}
.tok.sel{transform:translateY(-5px);box-shadow:0 0 0 3px var(--brass-2),0 8px 14px rgba(0,0,0,.6)}
.tok.dim{opacity:.35}
.tok[disabled]{pointer-events:none}
.actionbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:40px;text-align:center}
.status{font-family:var(--num);font-weight:700;font-size:14px;text-align:center;text-wrap:balance}
.status.you{color:var(--brass-2)}

.mine{background:rgba(42,28,19,.92);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:7px;transition:border-color .15s,background .15s}
.mine.hot{border-color:var(--good);background:rgba(60,90,50,.35)}
.mine .head{display:flex;align-items:center;gap:8px}
.mine .head .pts{margin-left:auto;font-family:var(--num);font-weight:800;font-size:22px}
.mine .head .pts small{font-size:12px;color:var(--dim)}
.holds{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.hold{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:8px;background:rgba(0,0,0,.25)}
.hold .chip{width:26px;height:26px;border-radius:50%;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.hold .chip img{width:100%;height:100%;object-fit:cover;transform:scale(1.22)}
.hold .t{font-family:var(--num);font-weight:800;font-size:15px;line-height:1}
.hold .b{font-family:var(--num);font-weight:700;font-size:11px;color:var(--dim);line-height:1}
.hold .b b{color:var(--ink)}
.myres{display:flex;gap:6px;align-items:center;min-height:20px}
.myres .lab{font-family:var(--num);font-weight:800;font-size:11px;letter-spacing:.14em;color:var(--brass);text-transform:uppercase}
.mynobles{display:flex;gap:4px}
.mynobles img{width:26px;height:26px;border-radius:5px;object-fit:cover;border:1px solid #7b5a33}
.dragghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;filter:drop-shadow(0 14px 22px rgba(0,0,0,.6))}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:60;background:#2f2014;border:1px solid var(--brass);border-radius:12px;padding:9px 15px;font-family:var(--num);font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,6,3,.86);display:flex;align-items:flex-end;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.sheet{background:#22170f;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:760px;max-height:100%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheethead{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheethead h2{flex:1;margin:0;font-family:var(--display);font-weight:400;font-size:26px;color:var(--brass-2)}
.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;font-family:var(--num);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:10px 9px 9px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brass-2);border-color:var(--brass-2)}
.sheetbody{overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch}
.guide h3{font-family:var(--num);font-weight:800;color:var(--brass);font-size:15px;letter-spacing:.04em;margin:18px 0 4px}
.guide h3:first-child{margin-top:0}
.guide p,.guide li{font-size:16px;margin:4px 0;max-width:68ch}
.guide ol,.guide ul{padding-left:20px;margin:4px 0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
th{font-family:var(--num);font-size:11px;letter-spacing:.08em;color:var(--brass);text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
.detail{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.detail .big{--cw:min(42vw,190px)}
.detail .info{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:10px}
.detail h4{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.paylist{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.paylist span{display:inline-flex;align-items:center;gap:4px;font-family:var(--num);font-weight:800;font-size:15px}
.paylist i{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.4)}
.podium{display:flex;flex-direction:column;gap:8px}
.podium .p{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg2)}
.podium .p.win{background:linear-gradient(90deg,rgba(217,167,74,.3),var(--bg2));border:1px solid var(--brass)}
.podium .pts{margin-left:auto;font-family:var(--num);font-weight:800;font-size:18px}
.podium .crown{position:static;transform:none;width:24px;height:18px}
.discard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.discard .d{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:10px;background:var(--bg2)}
.discard .d .chip{width:40px;height:40px;border-radius:50%;overflow:hidden}
.discard .d .chip img{width:100%;height:100%;object-fit:cover;transform:scale(1.22)}
.discard .d .ctl{display:flex;align-items:center;gap:8px;font-family:var(--num);font-weight:800}
.discard .d .ctl button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:20px}
.zoom img{max-width:min(440px,90vw);max-height:80vh;border-radius:16px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:14px;font-family:var(--num);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--brass);color:#2a1a05}
.seg button[disabled]{cursor:default}
.tmr{font-family:var(--num);font-weight:800;font-size:11px;color:var(--brass-2);font-variant-numeric:tabular-nums}
.tmr.big{font-size:15px;padding:2px 9px;border-radius:999px;background:rgba(217,167,74,.16)}
.tmr.low{color:#fff;background:var(--cinnabar);padding:1px 7px;border-radius:999px;animation:pulse .8s ease-in-out infinite}
.tmr:empty{display:none}
/* effects */
#fx{position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden}
#fx canvas{position:absolute;inset:0}
.fly{position:fixed;z-index:56;pointer-events:none;transition:transform .7s cubic-bezier(.3,.7,.2,1),opacity .7s;will-change:transform}
.fx-banner{position:fixed;left:50%;top:42%;z-index:57;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;width:min(92vw,520px);transform:translate(-50%,-50%);animation:ban 2s cubic-bezier(.2,.8,.2,1) forwards}
.fx-banner img{width:min(42vw,190px);aspect-ratio:1;object-fit:cover;border-radius:14px;border:3px solid var(--brass);box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 50px rgba(243,212,138,.5)}
.fx-banner .t{font-family:var(--display);font-size:clamp(30px,8vw,48px);line-height:1;color:#fff;text-shadow:0 0 20px var(--brass),0 3px 10px #000}
.fx-banner .l{font-family:var(--num);font-weight:800;font-size:14px;background:rgba(20,12,7,.85);padding:6px 12px;border-radius:999px}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}16%{transform:translate(-50%,-50%) scale(1.06);opacity:1}26%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-60%) scale(.9);opacity:0}}
.fx-welcome{position:fixed;inset:0;z-index:58;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;cursor:pointer;
  background:radial-gradient(ellipse at 50% 40%,rgba(90,52,20,.95),rgba(10,6,3,.98) 70%);animation:fade .4s ease-out}
.fx-welcome.out{animation:fxout .5s ease-in forwards}
@keyframes fade{from{opacity:0}to{opacity:1}} @keyframes fxout{to{opacity:0;transform:scale(1.04)}}
.fx-welcome .wl-fan{position:relative;height:min(30vw,150px);width:100%}
.fx-welcome .wl-fan img{position:absolute;left:50%;bottom:0;width:min(22vw,110px);aspect-ratio:1;object-fit:cover;margin-left:calc(min(22vw,110px) / -2);border-radius:50%;box-shadow:0 14px 30px rgba(0,0,0,.7);
  transform-origin:50% 160%;animation:wlfan 1s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc((var(--i) + 3) * .07s)}
@keyframes wlfan{from{transform:translateY(80px) scale(.5);opacity:0}to{transform:rotate(calc(var(--i) * 14deg));opacity:1}}
.fx-welcome h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,9vw,66px);line-height:1.05;max-width:14ch;margin:0;color:#fff2d8;text-shadow:0 0 30px rgba(243,212,138,.6),0 4px 14px #000;text-wrap:balance}
.fx-welcome h1 span{display:inline-block;animation:wlword .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes wlword{from{transform:translateY(26px) scale(.6);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.fx-welcome p{margin:0;font-family:var(--num);font-weight:800;letter-spacing:.1em;font-size:clamp(14px,4vw,20px);background:linear-gradient(90deg,#9a7432,#fff1c2,#d9a74a,#fff1c2,#9a7432);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:wlword .8s 1.6s both,shine 2.4s 2.2s linear infinite}
@keyframes shine{to{background-position:200% center}}
.fx-welcome small{font-family:var(--num);font-size:11px;letter-spacing:.3em;color:var(--dim);animation:wlword .6s 3s both}
#app{overflow:clip}
#app.shake>*{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

@media (max-width:859px){
  .side{display:contents}
  .opps{order:-1}
  .mine{position:sticky;bottom:0;order:10;z-index:5;box-shadow:0 -10px 24px rgba(10,6,3,.85);background:rgba(36,24,16,.97)}
  .mine{padding:6px 8px;gap:5px} .hold{padding:3px 0} .hold .chip{width:22px;height:22px} .hold .t{font-size:14px} .myres .dcard{--cw:40px!important}
  .layout{min-height:100%}
}
@media (min-width:860px){
  :root{--cw:96px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
  .side{position:sticky;top:0;display:flex;flex-direction:column;gap:10px}
  .opps{flex-direction:column;overflow:visible;padding-top:14px}
  .opp{max-width:none;flex:none}
  .noble{width:96px;height:96px}
  .tok{max-width:72px}
}
.rhint{font-size:13px;font-family:var(--num)}
@media (max-width:859px){ .rhint{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0} }
@media (orientation:landscape) and (max-height:540px) and (max-width:1100px){
  .side{display:flex;flex-direction:column;gap:8px;position:sticky;top:0;max-height:calc(100dvh - 70px);overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) min(330px,40vw);gap:12px;align-items:start}
  .mine{position:static;order:-1;box-shadow:none}
  .opps{order:0;flex-direction:column;overflow:visible;padding-top:12px}
  .opp{max-width:none;flex:none}
  .hold .chip{width:20px;height:20px}
}
@media (max-height:700px) and (max-width:859px){ :root{--cw:58px} .noble{width:64px;height:64px} }
@media (prefers-reduced-motion:reduce){.fly{transition:none}.fx-banner,.fx-welcome,.crown.pop{animation-duration:.01s}}
.badge.bot{background:#5b6bd6;color:#fff}
@media (max-width:400px){.lvt{display:none}}
.sndrow{padding:4px 2px 10px;font-size:14px}
.sheetbody .sndrow{border-bottom:1px solid var(--line);margin-bottom:12px}
.iabhint{background:#3a2a10;border:1px solid #c9a24a;color:#fbe7b5;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35;margin-bottom:12px}

/* no text selection / copy menu from long presses on the game table; Rules text and the share link stay selectable */
#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app .sheetbody,#app input,#app #link,#app code{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
