<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a0f0c">
<title>6 Nimmt! · Table Night</title>
<meta name="description" content="6 Nimmt! for 2–10 players on your phones. Start a table, share the link, play.">
<meta property="og:title" content="6 Nimmt! — join my game">
<meta property="og:description" content="Tap the link, enter your name, and don't take the sixth card.">
<meta property="og:image" content="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="../shared/kit.css?v=1">
<style>
/* Layout: four rows of cards across the middle, the players under them, your hand in the dock. */
:root{--bg:#1d0b09;--bg2:#2a120e;--panel:rgba(48,20,16,.82);--line:rgba(255,255,255,.13);--ink:#fff6ee;--dim:#d6bfb0;--gold:#ffb84d;--gold-2:#ffd99a;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Bricolage Grotesque",system-ui,sans-serif;--num:"Bricolage Grotesque",system-ui,sans-serif;color-scheme:dark;
  --bgimg:url("/nimmt/art/nimmt-hero@2x.webp?v=1");--dockbg:rgba(30,12,10,.93)}
.title{font-weight:800;letter-spacing:-.03em}
.btn{background:linear-gradient(180deg,#ffd99a,#ff9b3d);color:#2a0f04}
.panel{background:rgba(40,16,12,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sheet{background:var(--bg2)} .toast{background:var(--bg2)}
.fx-banner{background:rgba(30,12,10,.92);border-color:rgba(255,184,77,.35)}
.fx-banner .t{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
.ncard{position:relative;width:var(--nw,52px);aspect-ratio:2/3;flex:none}
.ncard svg{display:block;width:100%;height:100%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.rows{display:flex;flex-direction:column;gap:7px;padding:8px 2px 10px;--nw:clamp(40px,12.5vw,64px)}
.nrow{position:relative;display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.nrow.full{border-color:#ff6b5e;box-shadow:inset 0 0 0 1px rgba(255,107,94,.35)}
.nrow.pickable{cursor:pointer;border-color:var(--gold);animation:rowcall 1.2s ease-in-out infinite}
@keyframes rowcall{50%{box-shadow:0 0 0 3px rgba(255,184,77,.5),0 0 22px rgba(255,184,77,.45)}}
.slot{width:var(--nw);aspect-ratio:2/3;border-radius:7px;border:1.5px dashed rgba(255,255,255,.15);flex:none}
.slot.danger{border-color:rgba(255,107,94,.55);background:repeating-linear-gradient(45deg,rgba(255,107,94,.12) 0 6px,transparent 6px 12px)}
.rb{margin-left:auto;display:flex;align-items:center;gap:3px;font-weight:800;font-size:16px;flex:none;padding-left:4px}
.rb .hd,.val .hd{width:18px;height:16px}
.takeit{margin-left:6px;padding:4px 10px;border-radius:999px;background:var(--gold);color:#2a0f04;font-size:13px}
.ncard.drop{animation:drop .55s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--k) * 30ms)}
@keyframes drop{from{transform:translateY(-40px) rotate(-8deg) scale(1.15);opacity:0}}
.waitrow{display:flex;align-items:center;gap:8px;padding:0 4px 8px;flex-wrap:wrap}
.wq{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700}
.ncard.tiny{--nw:34px}
.chip .val{display:flex;align-items:center;gap:3px}
.hand{display:flex;gap:6px;overflow-x:auto;padding:16px 6px 4px;--nw:clamp(56px,17vw,80px);scrollbar-width:none;touch-action:pan-x}
.hand::-webkit-scrollbar{display:none}
.hand .ncard{cursor:pointer;transition:transform .25s cubic-bezier(.3,1.4,.5,1),opacity .25s}
.hand .ncard.ok:hover{transform:translateY(-8px)}
.hand .ncard.chosen{transform:translateY(-14px) scale(1.06)}
.hand .ncard.chosen svg{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.hand:has(.chosen) .ncard:not(.chosen){opacity:.45}
.reveal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;--nw:54px}
.reveal .rv{display:flex;flex-direction:column;align-items:center;gap:3px;animation:flipin .45s cubic-bezier(.2,1.2,.4,1) both}
.reveal .rv span{font-weight:800;font-size:12px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes flipin{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.hist{display:flex;flex-direction:column;gap:10px} .hist .h{background:var(--bg2);border-radius:12px;padding:10px 12px;display:flex}
.hist .h .crown{width:24px;height:18px}
@media (min-width:700px){.rows{--nw:70px}.chips{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
